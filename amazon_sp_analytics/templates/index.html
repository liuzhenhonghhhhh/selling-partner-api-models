<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亚马逊SP API多店铺销售分析系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/dashboard.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-graph-up"></i> 亚马逊SP API多店铺销售分析系统
            </span>
            <span class="text-white" id="last-update">最后更新: --</span>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <!-- 实时概览 -->
        <div class="row mb-3">
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h6 class="card-title"><i class="bi bi-shop"></i> 总店铺数</h6>
                        <h2 class="card-text" id="total-stores">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h6 class="card-title"><i class="bi bi-cart"></i> 1小时订单</h6>
                        <h2 class="card-text" id="total-orders-1h">0</h2>
                        <small id="orders-per-hour">0 单/小时</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <h6 class="card-title"><i class="bi bi-currency-dollar"></i> 1小时收入</h6>
                        <h2 class="card-text" id="total-revenue-1h">$0</h2>
                        <small id="revenue-per-hour">$0/小时</small>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-dark">
                    <div class="card-body">
                        <h6 class="card-title"><i class="bi bi-basket"></i> 平均订单价值</h6>
                        <h2 class="card-text" id="average-order-value">$0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- 24小时统计 -->
        <div class="row mb-3">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-calendar-day"></i> 24小时销售数据</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <h6>总订单数</h6>
                                <h3 id="orders-24h">0</h3>
                            </div>
                            <div class="col-md-3">
                                <h6>总销售额</h6>
                                <h3 id="revenue-24h">$0</h3>
                            </div>
                            <div class="col-md-3">
                                <h6>总销售件数</h6>
                                <h3 id="units-24h">0</h3>
                            </div>
                            <div class="col-md-3">
                                <h6>平均件/单</h6>
                                <h3 id="units-per-order">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图表区 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-graph-up-arrow"></i> 订单趋势（30天）</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="orderTrendChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-cash-stack"></i> 销售额趋势（30天）</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="revenueTrendChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 店铺排名 -->
        <div class="row mb-3">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-trophy"></i> 店铺排名 TOP 10</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>排名</th>
                                    <th>店铺名称</th>
                                    <th>订单数</th>
                                    <th>销售额</th>
                                    <th>占比</th>
                                </tr>
                            </thead>
                            <tbody id="store-rankings">
                                <!-- 动态填充 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 最近告警 -->
        <div class="row mb-3">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="bi bi-exclamation-triangle"></i> 最近告警</h5>
                    </div>
                    <div class="card-body">
                        <div id="recent-alerts" class="list-group">
                            <!-- 动态填充 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
